{% load static %}
<link rel="stylesheet" href="{% static 'css/style.css' %}">
<img src="{% static 'images/logo.png' %}" class="banner-logo" style="width: 75px; height: auto;">

<div class="container">
    <img src="{% static 'images/logo.png' %}" class="center-logo">
    <h2>Welcome Back!</h2>

    <!-- Error messages only show if Django sends them after a POST attempt -->
    {% if messages %}
        {% for message in messages %}
            <div class="alert-{{ message.tags }}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST" id="loginForm">
        {% csrf_token %}
        <div class="form-stack">
            <div class="input-group">
                <label>Username</label>
                <input type="text" name="username" id="uname" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" name="password" id="pword" required>
            </div>
            <button type="submit" class="btn-maroon" id="submitBtn" disabled>Login</button>
        </div>
    </form>

    <div class="footer-text">
        No Account?<br>
        <a href="{% url 'register' %}">Register</a>
    </div>
</div>

<script>
    const uname = document.getElementById('uname');
    const pword = document.getElementById('pword');
    const btn = document.getElementById('submitBtn');

    function checkInputs() {
        // Enable button only if both fields have text
        if (uname.value.trim() !== "" && pword.value.trim() !== "") {
            btn.disabled = false;
        } else {
            btn.disabled = true;
        }
    }

    uname.addEventListener('input', checkInputs);
    pword.addEventListener('input', checkInputs);
</script>
