{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - PitchPoint</title>
    <link rel="stylesheet" href="{% static 'css/register/register.css' %}">
</head>
<body>

    <!-- Updated to pull from static/images/ directly -->
    <img src="{% static 'images/logo.png' %}" class="banner-logo" alt="PitchPoint Banner Logo">

    <div class="container">
        <!-- Center Round Logo -->
        <img src="{% static 'images/logo.png' %}" class="center-logo" alt="PitchPoint Icon">
        <h2>Share Your Story</h2>

        {% if messages %}
            {% for message in messages %}
                <div class="alert-{{ message.tags }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" id="regForm">
            {% csrf_token %}
            <div class="form-grid">
                <div class="input-group">
                    <label for="fn">Full Name</label>
                    <input type="text" id="fn" name="fullname" required>
                </div>
                <div class="input-group">
                    <label for="un">Username</label>
                    <input type="text" id="un" name="username" required>
                </div>
                <div class="input-group">
                    <label for="pos">Position</label>
                    <select id="pos" name="position" required class="select-input">
                        <option value="" disabled selected></option>
                        <option value="Developer">Developer</option>
                        <option value="Designer">Designer</option>
                        <option value="Manager">Manager</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="email">TTSP Email</label>
                    <input type="email" id="email" name="ttsp_email" required>
                </div>
                <div class="input-group">
                    <label for="p1">Password</label>
                    <input type="password" id="p1" name="pass1" required>
                </div>
                <div class="input-group">
                    <label for="p2">Confirm Password</label>
                    <input type="password" id="p2" name="pass2" required>
                </div>
            </div>
            <button type="submit" class="btn-maroon" id="regBtn" disabled>Register</button>
        </form>

        <div class="footer-text">
            Already have an account?<br>
            <a href="{% url 'login:login' %}">Login</a>
        </div>
    </div>

    <script src="{% static 'js/register/register.js' %}"></script>
</body>
</html>
